<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Shubham Dwivedi bansuri logo">
  <defs>
    <linearGradient id="sd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc35c"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#sd-bg)"/>
  <!-- the bansuri, angled like it's being played -->
  <g transform="translate(-3 3) rotate(-36 32 32)">
    <!-- breath / sound waves leaving the flute's open end -->
    <g fill="none" stroke="#1a1206" stroke-linecap="round">
      <path d="M53 27.5 Q55.6 32 53 36.5" stroke-width="2.4"/>
      <path d="M57.5 23.5 Q62 32 57.5 40.5" stroke-width="2.4" opacity=".55"/>
    </g>
    <!-- bamboo body -->
    <rect x="5" y="28.6" width="44" height="6.8" rx="3.4" fill="#1a1206"/>
    <!-- silk bindings at the bamboo nodes -->
    <rect x="9" y="28.6" width="1.8" height="6.8" fill="#ffe2a8"/>
    <rect x="12" y="28.6" width="1" height="6.8" fill="#ffe2a8" opacity=".7"/>
    <!-- blowing hole -->
    <ellipse cx="17.5" cy="32" rx="1.9" ry="1.5" fill="#ffd27a"/>
    <!-- six finger holes -->
    <g fill="#ffd27a">
      <circle cx="26" cy="32" r="1.3"/><circle cx="30" cy="32" r="1.3"/><circle cx="34" cy="32" r="1.3"/>
      <circle cx="38.5" cy="32" r="1.3"/><circle cx="42.5" cy="32" r="1.3"/><circle cx="46.5" cy="32" r="1.3"/>
    </g>
  </g>
  <!-- a single note, rising -->
  <g fill="#1a1206">
    <ellipse cx="17" cy="20.5" rx="3.4" ry="2.5" transform="rotate(-22 17 20.5)"/>
    <path d="M19.6 19.6 V9.5 l5.5 2.6 v2.2 l-3.6 -1.6 V19.6z"/>
  </g>
</svg>
